<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLDC · callback</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#0F2A33}
  code{display:block;padding:12px;background:#F4F1EA;border-radius:8px;word-break:break-all;font-size:15px}
  button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#0F2A33;color:#fff;cursor:pointer}
</style>
</head>
<body>
  <h1>MLDC</h1>
  <p id="msg">Esperando código de autorización…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copiar código</button>
<script>
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), err = p.get('error');
  const msg = document.getElementById('msg');
  if (code) {
    msg.textContent = 'Código recibido. Pégalo en la consola de MLDC (es de un solo uso y expira rápido):';
    const el = document.getElementById('code'); el.textContent = code; el.hidden = false;
    const b = document.getElementById('copy'); b.hidden = false;
    b.onclick = () => navigator.clipboard.writeText(code).then(() => b.textContent = '¡Copiado!');
  } else if (err) {
    msg.textContent = 'Error de autorización: ' + err + ' ' + (p.get('error_description') || '');
  }
</script>
</body>
</html>
